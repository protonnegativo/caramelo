[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "caramelo-osint"
version = "0.1.0"
description = "Passive username OSINT: find someone's public profiles on thousands of validated sites, no API keys required."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Dennys Kaluzny Pereira" }]
keywords = ["osint", "username", "reconnaissance", "security", "sherlock", "whatsmyname"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Environment :: Console",
]
dependencies = [
  "httpx>=0.27,<1",
  "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
caramelo = "caramelo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/caramelo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests that hit the internet (run with -m network)"]
addopts = "-m 'not network'"
